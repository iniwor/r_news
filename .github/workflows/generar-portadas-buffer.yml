name: Generar portadas WebP y PNG para Buffer
on:
  push:
    paths:
      - 'requests/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portadas-buffer
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Generar WebP optimizado y PNG de respaldo desde r_news
        run: node scripts/render-portadas.cjs
      - name: Guardar WebP, PNG y manifiesto en GitHub
        run: |
          git add -A portadas/
          if git diff --cached --quiet; then
            echo "No hay portadas nuevas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generar portadas WebP y PNG automáticamente"
          # Otro commit (por ejemplo una solicitud nueva) puede llegar durante el render.
          # Reintegra los cambios remotos y reintenta sin sobrescribirlos.
          for intento in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Portadas publicadas correctamente (intento $intento)."
              exit 0
            fi
            echo "Conflicto al publicar; sincronizando rama (intento $intento/5)..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::No se pudo reintegrar un cambio concurrente; intervención necesaria."
              exit 1
            fi
            sleep $((intento * 2))
          done
          echo "::error::No fue posible publicar las portadas tras cinco intentos."
          exit 1
